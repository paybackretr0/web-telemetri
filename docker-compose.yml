services:
    telemetri-frankenphp:
        build:
            context: .
        container_name: telemetri-frankenphp
        env_file:
            - .env
        ports:
            - "8080:8000"
        volumes:
            - .:/app
        command: frankenphp php-server artisan octane:start
        networks:
            - laravel_network

networks:
    laravel_network:
        driver: bridge
